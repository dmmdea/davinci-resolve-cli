name: davinci-resolve
description: 'Drive DaVinci Resolve Studio through the resolve_bridge sidecar: 146 measured operations, page-null/modal-stall/handle-aware
  guards, transcript readback, transitions, multicam, render verify-by-file'
cli_description: Every documented DaVinci Resolve scripting operation, plus the cross-project history and doctor diagnostics
  that Resolve itself — and every other Resolve CLI or MCP server — throws away.
version: 0.1.0
category: media-and-entertainment
base_url: http://127.0.0.1:18800
health_check_path: /healthz
auth:
  type: none
config:
  format: toml
  path: ~/.config/davinci-resolve-pp-cli/config.toml
learn:
  disabled: true
mcp:
  transport:
  - stdio
  - http
  orchestration: code
  endpoint_tools: hidden
resources:
  system:
    description: 'Resolve app state: status, page, system presets, keyframe mode, background tasks, DCTL, quit'
    endpoints:
      status:
        method: GET
        path: /v1/status
        description: product, version, Studio flag, page (null = writes will fail), project, timeline, database, keyboard
          preset, rendering
        params: []
        mutation: false
        response:
          type: object
      list:
        method: GET
        path: /v1/presets
        description: layout / burn-in / prefs / keyboard (+current) / Fairlight preset lists
        params: []
        mutation: false
        response:
          type: object
      apply:
        method: POST
        path: /v1/preset
        description: 'system presets: KIND layout|burnin|prefs|keyboard|fairlight, ACTION load|save|update|delete|export|import'
        happy_args: --dry-run
        body:
        - name: kind
          type: string
          required: true
          positional: false
          description: kind
          enum:
          - layout
          - burnin
          - prefs
          - keyboard
          - fairlight
        - name: action
          type: string
          required: true
          positional: false
          description: action
          enum:
          - load
          - save
          - update
          - delete
          - export
          - import
        - name: name
          type: string
          required: false
          positional: false
          description: name
        - name: path
          type: string
          required: false
          positional: false
          description: path
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      keyframe-mode:
        method: GET
        path: /v1/keyframe-mode
        description: read the keyframe mode (all|color|sizing)
        params: []
        mutation: false
        response:
          type: object
      set-keyframe-mode:
        method: POST
        path: /v1/set-keyframe-mode
        description: set the keyframe mode
        happy_args: --mode=all;--yes
        body:
        - name: mode
          type: string
          required: true
          positional: false
          description: mode
          enum:
          - all
          - color
          - sizing
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      disable-background-tasks:
        method: POST
        path: /v1/disable-background-tasks
        description: DisableBackgroundTasksForCurrentResolveSession (no re-enable; restart Resolve to restore auto-backup)
        happy_args: --dry-run
        body:
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      quit:
        method: POST
        path: /v1/quit
        description: Resolve.Quit() (--save first)
        happy_args: --dry-run
        body:
        - name: save
          type: bool
          required: false
          positional: false
          description: save
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      page:
        method: POST
        path: /v1/page
        description: switch the GUI page
        happy_args: --name=edit;--yes
        body:
        - name: name
          type: string
          required: true
          positional: false
          description: page
          enum:
          - media
          - cut
          - edit
          - fusion
          - color
          - fairlight
          - deliver
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      validate-dctl:
        method: GET
        path: /v1/validate-dctl
        description: 21-1 ValidateDCTL from --source text or --path file
        happy_args: --path=C:/ProgramData/Blackmagic Design/DaVinci Resolve/Support/Developer/DaVinciCTL/Gain.dctl
        params:
        - name: source
          type: string
          required: false
          positional: false
          description: DCTL source text
        - name: path
          type: string
          required: false
          positional: false
          description: DCTL file
        mutation: false
        response:
          type: object
      encrypt-dctl:
        method: POST
        path: /v1/encrypt-dctl
        description: 21-1 EncryptDCTL a file (--name, --expiry ISO 8601, --out folder)
        happy_args: --dry-run
        body:
        - name: path
          type: string
          required: true
          positional: false
          description: DCTL file
        - name: name
          type: string
          required: false
          positional: false
          description: encrypted output name
        - name: expiry
          type: string
          required: false
          positional: false
          description: ISO 8601
        - name: out
          type: string
          required: false
          positional: false
          description: output folder
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      thumbnail:
        method: GET
        path: /v1/thumbnail
        description: GetCurrentClipThumbnailImage (Color page) -> --out FILE.ppm
        happy_args: --dry-run
        params:
        - name: out
          type: string
          required: false
          positional: false
          description: out
        mutation: false
        response:
          type: object
      export-frame:
        method: POST
        path: /v1/export-frame
        description: ExportCurrentFrameAsStill (.jpg/.png/.tif/.dpx/.drx; page-dependent)
        happy_args: --dry-run
        body:
        - name: path
          type: string
          required: true
          positional: false
          description: path
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
  project:
    description: project manager, database, folders, project settings and settings presets
    endpoints:
      list:
        method: GET
        path: /v1/projects
        description: projects in the current database folder
        params:
        - name: attributes
          type: bool
          required: false
          positional: false
          description: include per-project attributes (never opens them)
        mutation: false
        response:
          type: object
      create:
        method: POST
        path: /v1/create-project
        description: create AND load a project
        happy_args: --dry-run
        body:
        - name: name
          type: string
          required: true
          positional: false
          description: project name
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      load:
        method: POST
        path: /v1/load-project
        description: load a project (the page-null escape hatch)
        happy_args: --dry-run
        body:
        - name: name
          type: string
          required: true
          positional: false
          description: project name (switches the GUI)
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      delete:
        method: POST
        path: /v1/delete-project
        description: delete a project that is not loaded
        happy_args: --dry-run
        body:
        - name: name
          type: string
          required: true
          positional: false
          description: project name (not the loaded one)
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      save:
        method: POST
        path: /v1/save-project
        description: SaveProject on the current project
        happy_args: --yes
        body:
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      close:
        method: POST
        path: /v1/close-project
        description: close the current project (no save unless --save)
        happy_args: --dry-run
        body:
        - name: save
          type: bool
          required: false
          positional: false
          description: save before closing
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      rename:
        method: POST
        path: /v1/rename-project
        description: rename the current project
        happy_args: --dry-run
        body:
        - name: name
          type: string
          required: false
          positional: false
          description: name
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      export:
        method: POST
        path: /v1/export-project
        description: export a project to a .drp file
        happy_args: --dry-run
        body:
        - name: name
          type: string
          required: false
          positional: false
          description: name
        - name: path
          type: string
          required: true
          positional: false
          description: output .drp path
        - name: no-stills
          type: bool
          required: false
          positional: false
          description: exclude stills and LUTs
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      import:
        method: POST
        path: /v1/import-project
        description: import a .drp project file
        happy_args: --dry-run
        body:
        - name: path
          type: string
          required: true
          positional: false
          description: .drp path
        - name: name
          type: string
          required: false
          positional: false
          description: project name to import as
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      archive:
        method: POST
        path: /v1/archive-project
        description: 'REFUSED on purpose: ProjectManager.ArchiveProject crashed Resolve 21-1 from a script (measured 2026-09-09);
          use export-project or the GUI'
        happy_args: --dry-run
        body:
        - name: name
          type: string
          required: false
          positional: false
          description: name
        - name: path
          type: string
          required: true
          positional: false
          description: output .dra path
        - name: no-source-media
          type: bool
          required: false
          positional: false
          description: no source media
        - name: no-render-cache
          type: bool
          required: false
          positional: false
          description: no render cache
        - name: proxy-media
          type: bool
          required: false
          positional: false
          description: proxy media
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      restore:
        method: POST
        path: /v1/restore-project
        description: RestoreProject from a .dra archive
        happy_args: --dry-run
        body:
        - name: path
          type: string
          required: true
          positional: false
          description: .dra path
        - name: name
          type: string
          required: false
          positional: false
          description: name
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      cloud:
        method: POST
        path: /v1/cloud-project
        description: 'Blackmagic Cloud project create/load/import/restore (unverified: no cloud library here)'
        happy_args: --dry-run
        body:
        - name: action
          type: string
          required: true
          positional: false
          description: action
          enum:
          - create
          - load
          - import
          - restore
        - name: name
          type: string
          required: false
          positional: false
          description: projectName
        - name: media-path
          type: string
          required: false
          positional: false
          description: projectMediaPath (required)
        - name: path
          type: string
          required: false
          positional: false
          description: file (import) or folder (restore)
        - name: settings
          type: string
          required: false
          positional: false
          description: 'extra CloudSettings JSON: isCollab, syncMode, isCameraAccess (JSON value as a string)'
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      settings:
        method: GET
        path: /v1/project-settings
        description: all 158 project settings, or one key
        happy_args: --key=timelineFrameRate
        params:
        - name: key
          type: string
          required: false
          positional: false
          description: a single setting key
        mutation: false
        response:
          type: object
      set-settings:
        method: POST
        path: /v1/set-project-settings
        description: set project settings from JSON; one key per call, per-key result, read back
        happy_args: --dry-run
        body:
        - name: settings
          type: string
          required: true
          positional: false
          description: '{"timelineFrameRate": "29.97", ...} (JSON value as a string)'
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      settings-presets:
        method: GET
        path: /v1/project-settings-presets
        description: project-settings presets (name, width, height)
        params: []
        mutation: false
        response:
          type: object
      settings-preset:
        method: POST
        path: /v1/project-settings-preset
        description: apply/save/update/delete/export/import a project-settings preset
        happy_args: --dry-run
        body:
        - name: action
          type: string
          required: true
          positional: false
          description: action
          enum:
          - apply
          - save
          - update
          - delete
          - export
          - import
        - name: name
          type: string
          required: true
          positional: false
          description: preset name
        - name: path
          type: string
          required: false
          positional: false
          description: file path for export/import
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      database:
        method: GET
        path: /v1/database
        description: current project database and the list of databases
        params: []
        mutation: false
        response:
          type: object
      set-database:
        method: POST
        path: /v1/set-database
        description: switch the project database (Disk or PostgreSQL); CLOSES the open project
        happy_args: --dry-run
        body:
        - name: type
          type: string
          required: true
          positional: false
          description: DbType
          enum:
          - Disk
          - PostgreSQL
        - name: name
          type: string
          required: true
          positional: false
          description: DbName
        - name: ip
          type: string
          required: false
          positional: false
          description: IpAddress for PostgreSQL
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      folders:
        method: GET
        path: /v1/folders
        description: project-manager folder listing (folders + projects in the current folder)
        params: []
        mutation: false
        response:
          type: object
      folder:
        method: POST
        path: /v1/folder
        description: 'project-manager folder navigation: create/delete/open/root/parent'
        happy_args: --dry-run
        body:
        - name: action
          type: string
          required: true
          positional: false
          description: action
          enum:
          - create
          - delete
          - open
          - root
          - parent
        - name: name
          type: string
          required: false
          positional: false
          description: folder name (create/delete/open)
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
  storage:
    description: media storage browsing/import and the 21.1 clone tool
    endpoints:
      volumes:
        method: GET
        path: /v1/storage-volumes
        description: media storage mounted volumes
        params: []
        mutation: false
        response:
          type: object
      browse:
        method: GET
        path: /v1/storage-browse
        description: media storage folders (and files with --files) under a path
        happy_args: --path=C:/Media
        params:
        - name: path
          type: string
          required: true
          positional: false
          description: path
        - name: files
          type: bool
          required: false
          positional: false
          description: include files
        mutation: false
        response:
          type: object
      import:
        method: POST
        path: /v1/storage-import
        description: import storage paths into the current pool folder (subclip range, clip mattes, timeline mattes)
        happy_args: --dry-run
        body:
        - name: paths
          type: string
          required: true
          positional: false
          description: storage paths (comma-free single value or a JSON array string)
        - name: start-frame
          type: int
          required: false
          positional: false
          description: start frame
        - name: end-frame
          type: int
          required: false
          positional: false
          description: end frame
        - name: matte-for
          type: string
          required: false
          positional: false
          description: 'clip ref: add these as clip mattes'
        - name: bin
          type: string
          required: false
          positional: false
          description: scope --matte-for lookup
        - name: stereo-eye
          type: string
          required: false
          positional: false
          description: stereo eye
          enum:
          - left
          - right
        - name: timeline-mattes
          type: bool
          required: false
          positional: false
          description: add as timeline mattes
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
      clone-status:
        method: GET
        path: /v1/clone-status
        description: media clone job status (21-1)
        params: []
        mutation: false
        response:
          type: object
      clone-media:
        method: POST
        path: /v1/clone-media
        description: start (or --stop) a verified media clone (21-1 clone tool)
        happy_args: --dry-run
        body:
        - name: source
          type: string
          required: false
          positional: false
          description: source directory
        - name: targets
          type: string
          required: false
          positional: false
          description: target directories (comma-free single value or a JSON array string)
        - name: checksum
          type: string
          required: false
          positional: false
          description: checksum
          enum:
          - none
          - filesize
          - crc32
          - md5
          - sha256
          - sha512
          - xxh64
        - name: preserve-folder-name
          type: bool
          required: false
          positional: false
          description: preserve folder name
        - name: stop
          type: bool
          required: false
          positional: false
          description: stop the running clone
        - name: 'yes'
          type: bool
          required: false
          positional: false
          default: true
          description: confirm the write (the bridge refuses without it)
        - name: timeout
          type: int
          required: false
          positional: false
          default: 25
          description: per-call watchdog seconds (a trip stops the sidecar)
        response:
          type: object
  pool:
    description: media pool bins and clip lifecycle
    endpoints:
      clips:
        method: GET
        path: /v1/pool
        description: media pool clips
        happy_args: --recursive
        params:
        - name: recursive
          type: bool
          required: false
          positional: false
          description: walk all media pool folders
        mutation: false
        response:
          type: object
      bins:
        method: GET
        path: /v1/bins
        description: media pool bin tree with clip counts
        params:
        - name: bin
          type: string
          required: false
          positional: false
          description: scope the clip lookup to this bin path (A/B)
        mutation: false
        response:
          type: object
      bin:
